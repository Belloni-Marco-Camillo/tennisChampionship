<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Registrazione - Tennis Championship</title>
    <link rel="stylesheet" href="/style.css">
  </head>
  <body>
    <div class="container">
      <h1>Registrati</h1>
      <form method="post" action="/auth/register">
        <label>Nome</label>
        <input name="nome" type="text" required />

        <label>Cognome</label>
        <input name="cognome" type="text" required />

        <label>Email</label>
        <input name="email" type="email" required />

        <label>Password</label>
        <input name="password" type="password" required />

        <label class="checkbox">
          <input name="championship_owner" type="checkbox" value="1" />
          Sono owner del campionato
        </label>

        <button type="submit">Registrati</button>
      </form>
      <script src="/csrf.js"></script>
      <p><a href="/login">Hai già un account? Accedi</a></p>
    </div>
  </body>
</html>
